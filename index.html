<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A personal log of sporting events you have attended.">
  <title>Game Log | Sports Event Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">A personal record</p>
        <h1>Sporting Events I've been to</h1>
        <p class="page-intro">Every match you've been to... in one place.</p>
      </div>
      <p class="total-count"><span id="event-count" aria-live="polite">0</span> games logged</p>
    </header>

    <div class="tracker-layout">
      <section class="entry-panel" aria-labelledby="entry-heading">
        <h2 id="entry-heading">Add a game</h2>
        <form id="event-form">
          <label for="event-sport">Sport</label>
          <select id="event-sport" name="sport" required>
            <option value="">Choose a sport</option>
            <option>Baseball</option>
            <option>Basketball</option>
            <option>Football</option>
            <option>Hockey</option>
            <option>NASCAR</option>
            <option>Soccer</option>
            <option>Other</option>
          </select>

          <label for="event-name">Game or teams</label>
          <input id="event-name" name="name" type="text" placeholder="Cavaliers vs. Knicks" required>

          <label for="event-date">Date</label>
          <input id="event-date" name="date" type="date" required>

          <label for="event-venue">Venue</label>
          <input id="event-venue" name="venue" type="text" placeholder="Rocket Arena" required>

          <button class="save-button" type="submit"><span aria-hidden="true">+</span> Save game</button>
        </form>
        <p class="form-note">Your event list is saved in this browser.</p>
      </section>

      <section class="log-panel" aria-labelledby="log-heading">
        <div class="log-header">
          <div>
            <p class="eyebrow">Your collection</p>
            <h2 id="log-heading">Event log</h2>
          </div>
          <div class="log-controls">
            <div class="filter-control">
              <label for="sport-filter">Show</label>
              <select id="sport-filter">
                <option value="all">All sports</option>
                <option>Baseball</option>
                <option>Basketball</option>
                <option>Football</option>
                <option>Hockey</option>
                <option>NASCAR</option>
                <option>Soccer</option>
                <option>Other</option>
              </select>
            </div>
            <div class="filter-control">
              <label for="sort-order">Sort</label>
              <select id="sort-order">
                <option value="date">Newest first</option>
                <option value="team">Team / matchup A-Z</option>
              </select>
            </div>
          </div>
        </div>

        <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
        <p class="empty-state" id="empty-state">No games added yet. Your first one can go here.</p>
        <ul class="event-list" id="event-list" aria-label="Saved sporting events"></ul>
      </section>
    </div>

    <footer class="page-footer">
      <span>GAME LOG</span>
      <span>Saved on this device</span>
    </footer>
  </main>
  <script src="js/app.js" defer></script>
</body>
</html>
